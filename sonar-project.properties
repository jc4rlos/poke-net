# SonarQube Configuration
sonar.projectKey=jc4rlos_poke-net
sonar.projectName=PokeNet
sonar.projectVersion=1.0

# Organización en SonarQube Cloud
sonar.organization=jc4rlos

# Lenguaje principal
sonar.language=csharp

# Versión de .NET
sonar.dotnet.targetFramework=net8.0

# Directorio de fuentes
sonar.sources=.

# Exclusiones de análisis
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,.git/**,.github/**,Properties/**

# Cobertura de código (opcional - si tienes tests)
# sonar.coverageReportPaths=coverage/coverage.opencover.xml

# Reglas de seguridad
sonar.security.hotspots.reviewRatioTarget=100
