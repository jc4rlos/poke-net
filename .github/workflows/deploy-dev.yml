name: Deploy Dev - Manual por Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag dev-vX.X.X a desplegar (ej: dev-v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and Publish
    runs-on: self-hosted
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Detener PokeNet anterior (por puerto)
        shell: powershell
        env:
          KESTREL_PORT: ${{ vars.KESTREL_PORT }}
        run: |
          Write-Host "[INFO] Buscando proceso en puerto $env:KESTREL_PORT..." -ForegroundColor Cyan
          $connection = Get-NetTCPConnection -LocalPort $env:KESTREL_PORT -State Listen -ErrorAction SilentlyContinue

          if ($connection) {
            $process = Get-Process -Id $connection.OwningProcess -ErrorAction SilentlyContinue
            if ($process) {
              Write-Host "[INFO] Deteniendo: $($process.Name) (PID: $($process.Id))" -ForegroundColor Yellow
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              Write-Host "[OK] Proceso detenido" -ForegroundColor Green
            }
          } else {
            Write-Host "[INFO] No hay nada escuchando en puerto $env:KESTREL_PORT" -ForegroundColor Cyan
          }

      - name: Checkout al tag especificado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Validar formato del tag
        shell: powershell
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ($tag -notmatch '^dev-v\d+\.\d+\.\d+') {
            Write-Host "ERROR: El tag debe tener formato dev-vX.X.X (ej: dev-v1.0.0)" -ForegroundColor Red
            exit 1
          }
          Write-Host "[OK] Tag validado: $tag" -ForegroundColor Green

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        shell: powershell
        run: |
          Write-Host "[INFO] Restaurando dependencias..." -ForegroundColor Cyan
          dotnet restore
          Write-Host "[OK] Dependencias restauradas" -ForegroundColor Green

      - name: Compilar (Release)
        shell: powershell
        run: |
          Write-Host "[INFO] Compilando en modo Release..." -ForegroundColor Cyan
          dotnet build -c Release --no-restore
          Write-Host "[OK] Compilación completada" -ForegroundColor Green

      - name: Publicar a carpeta de despliegue
        shell: powershell
        run: |
          $deployPath = $env:DEPLOY_PATH
          Write-Host "[INFO] Publicando a: $deployPath" -ForegroundColor Cyan

          if (-not (Test-Path $deployPath)) {
            New-Item -ItemType Directory -Path $deployPath -Force | Out-Null
            Write-Host "[OK] Carpeta creada" -ForegroundColor Green
          }

          dotnet publish -c Release -o $deployPath --no-build
          Write-Host "[OK] Publicación completada" -ForegroundColor Green

      - name: Validar publicación
        shell: powershell
        run: |
          $deployPath = $env:DEPLOY_PATH
          if (-not (Test-Path "$deployPath/appsettings.json")) {
            Write-Host "ERROR: $deployPath/appsettings.json no existe" -ForegroundColor Red
            exit 1
          }
          if (-not (Test-Path "$deployPath/PokeNet.dll")) {
            Write-Host "ERROR: $deployPath/PokeNet.dll no existe" -ForegroundColor Red
            exit 1
          }
          Write-Host "[OK] Publicación validada" -ForegroundColor Green

      - name: Listar archivos publicados
        shell: powershell
        run: |
          $deployPath = $env:DEPLOY_PATH
          Write-Host ""
          Write-Host "[INFO] Archivos en $deployPath" -ForegroundColor Cyan
          Get-ChildItem -Path $deployPath -File | Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          $fileCount = (Get-ChildItem -Path $deployPath -Recurse -File).Count
          Write-Host "[INFO] Total de archivos: $fileCount" -ForegroundColor Cyan

  deploy:
    name: Deploy to Kestrel
    needs: build
    runs-on: self-hosted
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      KESTREL_PORT: ${{ vars.KESTREL_PORT }}
      KESTREL_URL: ${{ vars.KESTREL_URL }}
      APP_NAME: ${{ vars.APP_NAME }}
      LOG_FILE_PATH: ${{ vars.LOG_FILE_PATH }}

    steps:
      - name: Crear script de inicio
        shell: powershell
        run: |
          $scriptPath = Join-Path $env:DEPLOY_PATH "start-kestrel.ps1"
          $lines = @(
            'param([int]$Port = ' + $env:KESTREL_PORT + ')',
            '',
            'Write-Host "===============================================================" -ForegroundColor Cyan',
            'Write-Host "  Iniciando ' + $env:APP_NAME + ' en Kestrel" -ForegroundColor Cyan',
            'Write-Host "===============================================================" -ForegroundColor Cyan',
            'Write-Host ""',
            'Write-Host "Puerto: $Port" -ForegroundColor Yellow',
            'Write-Host "URL: http://localhost:$Port" -ForegroundColor Yellow',
            'Write-Host ""',
            '',
            '$env:ASPNETCORE_URLS = "http://+:$Port"',
            '$env:ASPNETCORE_ENVIRONMENT = "Development"',
            '',
            'cd "' + $env:DEPLOY_PATH + '"',
            '',
            'Write-Host "Iniciando aplicación..." -ForegroundColor Cyan',
            'Write-Host ""',
            '',
            'dotnet PokeNet.dll',
            '',
            'Write-Host ""',
            'Write-Host "Aplicación detenida" -ForegroundColor Yellow'
          )
          $lines | Set-Content -Path $scriptPath -Force
          Write-Host "[OK] Script de inicio creado: $scriptPath" -ForegroundColor Green

      - name: Iniciar Kestrel en background
        shell: powershell
        run: |
          Write-Host "[INFO] Iniciando Kestrel en background..." -ForegroundColor Cyan

          $scriptPath = Join-Path $env:DEPLOY_PATH "start-kestrel.ps1"

          Start-Process -NoNewWindow -FilePath powershell.exe `
            -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$scriptPath`" -Port $env:KESTREL_PORT"

          Start-Sleep -Seconds 3

          if (Test-NetConnection -ComputerName localhost -Port $env:KESTREL_PORT -WarningAction SilentlyContinue) {
            Write-Host "[OK] Kestrel está escuchando en $env:KESTREL_URL" -ForegroundColor Green
          } else {
            Write-Host "[WARN] Verificando Kestrel..." -ForegroundColor Yellow
          }

          Write-Host "[INFO] Para ver logs: Get-Content $env:LOG_FILE_PATH -Tail 50" -ForegroundColor Cyan

      - name: Resumen del despliegue
        if: success()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host ""
          Write-Host "   DESPLIEGUE COMPLETADO EN RUNNER LOCAL" -ForegroundColor Green
          Write-Host ""
          Write-Host ""
          Write-Host "Tag:              ${{ github.event.inputs.tag }}" -ForegroundColor Cyan
          Write-Host "App:              $env:APP_NAME" -ForegroundColor Cyan
          Write-Host "Ambiente:         Desarrollo (DEV)" -ForegroundColor Cyan
          Write-Host "Fecha:            $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" -ForegroundColor Cyan
          Write-Host "Carpeta:          $env:DEPLOY_PATH" -ForegroundColor Cyan
          Write-Host "Servidor:         Kestrel (en background)" -ForegroundColor Cyan
          Write-Host "URL:              $env:KESTREL_URL" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "ESTADO:" -ForegroundColor Yellow
          Write-Host "[OK] Kestrel está corriendo en background" -ForegroundColor Green
          Write-Host "[OK] App disponible en $env:KESTREL_URL" -ForegroundColor Green
          Write-Host ""
          Write-Host "COMANDOS UTILES:" -ForegroundColor Cyan
          Write-Host "Detener:  taskkill /IM dotnet.exe /F" -ForegroundColor White
          Write-Host "Ver logs: Get-Content $env:LOG_FILE_PATH -Tail 50" -ForegroundColor White
          Write-Host ""

      - name: Notificar fallo
        if: failure()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host ""
          Write-Host "   FALLO EN EL DESPLIEGUE" -ForegroundColor Red
          Write-Host ""
          Write-Host ""
          Write-Host "Tag:      ${{ github.event.inputs.tag }}" -ForegroundColor Cyan
          Write-Host "App:      $env:APP_NAME" -ForegroundColor Cyan
          Write-Host "Estado:   FALLIDO" -ForegroundColor Red
          Write-Host ""
          Write-Host "Revisa los logs arriba para más detalles" -ForegroundColor Yellow
          Write-Host ""
          exit 1
