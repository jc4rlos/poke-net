name: Deploy Dev - Manual por Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag dev-vX.X.X a desplegar (ej: dev-v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and Publish
    runs-on: self-hosted
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Detener PokeNet anterior (por puerto)
        shell: powershell
        env:
          KESTREL_PORT: ${{ vars.KESTREL_PORT }}
        run: |
          $connection = Get-NetTCPConnection -LocalPort $env:KESTREL_PORT -State Listen -ErrorAction SilentlyContinue
          if ($connection) {
            $process = Get-Process -Id $connection.OwningProcess -ErrorAction SilentlyContinue
            if ($process) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
            }
          }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish
        run: dotnet publish -c Release -o ${{ vars.DEPLOY_PATH }} --no-build

  deploy:
    name: Deploy to Kestrel
    needs: build
    runs-on: self-hosted

    steps:
      - name: Create start script
        shell: powershell
        run: |
          $port = "${{ vars.KESTREL_PORT }}"
          $path = "${{ vars.DEPLOY_PATH }}"
          $lines = @(
            "param([int]`$Port = $port)",
            "`$env:ASPNETCORE_URLS = `"http://+:`$Port`"",
            "`$env:ASPNETCORE_ENVIRONMENT = `"Development`"",
            "cd `"$path`"",
            "dotnet PokeNet.dll"
          )
          $lines -join "`n" | Set-Content -Path "$path\start-kestrel.ps1" -Force

      - name: Start Kestrel
        shell: powershell
        run: |
          $scriptPath = "${{ vars.DEPLOY_PATH }}\start-kestrel.ps1"
          Start-Process -NoNewWindow -FilePath powershell.exe -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$scriptPath`" -Port ${{ vars.KESTREL_PORT }}"
          Start-Sleep -Seconds 3
          if (Test-NetConnection -ComputerName localhost -Port ${{ vars.KESTREL_PORT }} -WarningAction SilentlyContinue) {
            Write-Host "OK - Kestrel running at ${{ vars.KESTREL_URL }}" -ForegroundColor Green
          }
